<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Foxor Search — a clean, simple way to search the web.">
  <meta name="theme-color" content="#11130f">
  <title>Foxor Search</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <a class="brand" href="https://foxphantom203.github.io/foxor/" aria-label="Foxor Overview">FOXOR<span>SEARCH</span></a>
    <p class="eyebrow">Explore the web</p>
    <h1>What are you looking for?</h1>
    <p class="subtitle">A straightforward search starting point from the Foxor ecosystem.</p>
    <form id="searchForm" class="search-form" role="search">
      <label class="visually-hidden" for="query">Search the web</label>
      <input id="query" name="q" type="search" placeholder="Search anything…" autocomplete="off" required>
      <button type="submit">Search <span aria-hidden="true">↗</span></button>
    </form>
    <p class="provider-note">Search results are provided by Brave Search.</p>
    <footer>
      <a href="https://foxphantom203.github.io/foxor/">Foxor Overview</a>
      <span>·</span>
      <a href="https://github.com/FoxPhantom203/foxphantom203.github.io/tree/main/foxor-search">Source</a>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
