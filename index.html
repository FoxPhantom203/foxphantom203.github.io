  <style>
    :root {
      --bg: #0f0f12;
      --surface: rgba(26, 26, 34, 0.88);
      --text: #e8e8ed;
      --muted: #9a9aad;
      --accent: #ff6b35;
      --accent-soft: rgba(255, 107, 53, 0.15);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      height: 100%;
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      background-image:
        linear-gradient(135deg, rgba(15,15,18,0.88) 0%, rgba(20,10,30,0.75) 50%, rgba(15,15,18,0.9) 100%),
        url("https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1920&q=80");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      color: var(--text);
      min-height: 100%;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(1rem, 4vw, 2.5rem);
      line-height: 1.6;
      position: relative;
      overflow-x: hidden;
    }

    /* Orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
      animation: float 12s ease-in-out infinite;
      will-change: transform;
    }
    .orb-1 { width: min(320px, 40vw); height: min(320px, 40vw); background: #ff6b35; top: -80px; left: -60px; }
    .orb-2 { width: min(280px, 35vw); height: min(280px, 35vw); background: #7c3aed; bottom: -40px; right: -40px; animation-delay: -4s; }
    .orb-3 { width: min(180px, 25vw); height: min(180px, 25vw); background: #06b6d4; top: 40%; left: 10%; animation-delay: -7s; }
    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -20px) scale(1.05); }
      66% { transform: translate(-20px, 15px) scale(0.95); }
    }

    /* Sparkles */
    .sparkle {
      position: fixed;
      width: 6px; height: 6px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 8px 2px rgba(255,255,255,0.6);
      pointer-events: none;
      z-index: 0;
      animation: twinkle 3s ease-in-out infinite;
    }
    .sparkle:nth-child(1) { top: 12%; left: 18%; animation-delay: 0.2s; }
    .sparkle:nth-child(2) { top: 25%; right: 22%; animation-delay: 1.1s; }
    .sparkle:nth-child(3) { bottom: 30%; left: 28%; animation-delay: 0.7s; }
    .sparkle:nth-child(4) { bottom: 18%; right: 15%; animation-delay: 1.8s; }
    .sparkle:nth-child(5) { top: 55%; left: 8%; animation-delay: 0.4s; }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* Click particles canvas */
    #particles {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: clamp(1rem, 3vw, 1.25rem);
      padding: clamp(1.5rem, 5vw, 2.5rem) clamp(1.25rem, 5vw, 3rem);
      max-width: min(420px, 100%);
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      transition: transform 0.15s ease-out, box-shadow 0.2s ease;
      transform-style: preserve-3d;
      will-change: transform;
      touch-action: manipulation;
    }
    .card:hover {
      box-shadow: 0 24px 60px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,107,53,0.2);
    }

    .avatar {
      width: clamp(72px, 20vw, 96px);
      height: clamp(72px, 20vw, 96px);
      border-radius: 50%;
      background: var(--accent-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      margin: 0 auto 1.25rem;
      border: 2px solid var(--accent);
      box-shadow: 0 0 24px rgba(255, 107, 53, 0.35);
      animation: pulse-glow 3s ease-in-out infinite;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s ease;
    }
    .avatar:active { transform: scale(0.92); }
    .avatar.pop { animation: pop 0.4s ease; }
    @keyframes pop {
      0% { transform: scale(1); }
      40% { transform: scale(1.25); }
      100% { transform: scale(1); }
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(255, 107, 53, 0.3); }
      50% { box-shadow: 0 0 36px rgba(255, 107, 53, 0.55); }
    }

    h1 {
      font-family: "Orbitron", sans-serif;
      font-size: clamp(1.35rem, 4.5vw, 1.75rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
      background: linear-gradient(90deg, #ff6b35, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .tagline {
      color: var(--muted);
      font-size: clamp(0.85rem, 2.5vw, 0.95rem);
      margin-bottom: 1.25rem;
    }
    .bio {
      color: var(--muted);
      font-size: clamp(0.85rem, 2.5vw, 0.95rem);
      margin-bottom: 1.5rem;
    }

    .links {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .links a {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.55rem 1.15rem;
      border-radius: 999px;
      background: var(--accent);
      color: #fff !important;
      text-decoration: none !important;
      font-weight: 600;
      font-size: clamp(0.8rem, 2.5vw, 0.9rem);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      box-shadow: 0 4px 14px rgba(255, 107, 53, 0.35);
      min-height: 44px; /* touch target */
    }
    .links a:hover, .links a:focus-visible {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 8px 22px rgba(255, 107, 53, 0.5);
      outline: none;
    }
    .links a:active { transform: translateY(0) scale(0.98); }
    .links a.secondary {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: var(--text) !important;
      box-shadow: none;
    }
    .links a.secondary:hover, .links a.secondary:focus-visible {
      border-color: var(--accent);
      color: var(--accent) !important;
      box-shadow: 0 4px 14px rgba(255, 107, 53, 0.2);
    }

    footer {
      position: relative;
      z-index: 1;
      margin-top: clamp(1.5rem, 4vw, 2.5rem);
      color: var(--muted);
      font-size: clamp(0.7rem, 2vw, 0.8rem);
      text-align: center;
    }

    .deco-icons {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      margin-bottom: 1rem;
      font-size: 1.1rem;
      opacity: 0.7;
    }
    .deco-icons span {
      animation: bounce-soft 2.5s ease-in-out infinite;
      display: inline-block;
    }
    .deco-icons span:nth-child(2) { animation-delay: 0.3s; }
    .deco-icons span:nth-child(3) { animation-delay: 0.6s; }
    @keyframes bounce-soft {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .live-clock {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 1.25rem;
      opacity: 0.8;
      font-variant-numeric: tabular-nums;
    }

    .tip {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 0.75rem;
      opacity: 0.55;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: rgba(26,26,34,0.95);
      color: #fff;
      padding: 0.6rem 1.2rem;
      border-radius: 999px;
      font-size: 0.85rem;
      border: 1px solid rgba(255,107,53,0.4);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      z-index: 100;
      transition: transform 0.35s cubic-bezier(0.22,1,0.36,1), opacity 0.35s ease;
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .orb, .sparkle, .avatar, .deco-icons span { animation: none !important; }
      .card { transition: none; }
    }

    /* Small phones */
    @media (max-width: 360px) {
      .links { flex-direction: column; align-items: stretch; }
      .links a { justify-content: center; }
    }

    /* Large screens – keep centered, no stretch */
    @media (min-width: 1200px) {
      body { padding: 3rem; }
    }
  </style>
</head>
<body>
  <div class="orb orb-1" aria-hidden="true"></div>
  <div class="orb orb-2" aria-hidden="true"></div>
  <div class="orb orb-3" aria-hidden="true"></div>
  <div class="sparkle" aria-hidden="true"></div>
  <div class="sparkle" aria-hidden="true"></div>
  <div class="sparkle" aria-hidden="true"></div>
  <div class="sparkle" aria-hidden="true"></div>
  <div class="sparkle" aria-hidden="true"></div>

  <canvas id="particles" aria-hidden="true"></canvas>

  <main class="card animate__animated animate__fadeInUp" id="card" role="main">
    <div class="deco-icons" aria-hidden="true">
      <span>✨</span><span>🦊</span><span>✨</span>
    </div>
    <div class="avatar" id="avatar" title="Click me!" role="button" tabindex="0" aria-label="Fox avatar – click for fun">🦊</div>
    <h1>FoxPhantom203</h1>
    <p class="tagline">Creative fox · coding & building</p>
    <p class="bio">Wassup! Making pages and shipping projects. Welcome to my corner of the internet.</p>
    <div class="links">
      <a href="https://github.com/FoxPhantom203" target="_blank" rel="noopener noreferrer"><i class="fab fa-github" aria-hidden="true"></i> GitHub</a>
      <a class="secondary" href="mailto:foxphantom203@tutamail.com"><i class="fas fa-envelope" aria-hidden="true"></i> Email</a>
    </div>
    <div class="live-clock" id="clock" aria-live="polite"></div>
    <p class="tip">Tip: move mouse over the card · click the fox</p>
  </main>

  <footer>foxphantom203.github.io</footer>
  <div class="toast" id="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/semantic-ui@2.5.0/dist/semantic.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/uikit@3.21.5/dist/js/uikit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/halfmoon@2.0.1/js/halfmoon.min.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.1/cdn/shoelace.js"></script>

  <script>
    (function () {
      const card = document.getElementById('card');
      const avatar = document.getElementById('avatar');
      const clock = document.getElementById('clock');
      const toast = document.getElementById('toast');
      const canvas = document.getElementById('particles');
      const ctx = canvas.getContext('2d');
      let particles = [];
      let reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Resize canvas
      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      // Live clock
      function updateClock() {
        const now = new Date();
        clock.textContent = now.toLocaleString(undefined, {
          weekday: 'short', year: 'numeric', month: 'short', day: 'numeric',
          hour: '2-digit', minute: '2-digit', second: '2-digit'
        });
      }
      updateClock();
      setInterval(updateClock, 1000);

      // Toast helper
      let toastTimer;
      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
      }

      // 3D tilt on pointer move
      if (!reduceMotion) {
        card.addEventListener('pointermove', (e) => {
          const rect = card.getBoundingClientRect();
          const x = (e.clientX - rect.left) / rect.width - 0.5;
          const y = (e.clientY - rect.top) / rect.height - 0.5;
          card.style.transform = `perspective(800px) rotateY(${x * 12}deg) rotateX(${-y * 12}deg) scale3d(1.02,1.02,1.02)`;
        });
        card.addEventListener('pointerleave', () => {
          card.style.transform = '';
        });
      }

      // Particle burst
      function burst(x, y, count = 18) {
        if (reduceMotion) return;
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + Math.random() * 0.4;
          const speed = 2 + Math.random() * 4;
          particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            size: 2 + Math.random() * 3,
            color: Math.random() > 0.5 ? '#ff6b35' : '#fbbf24'
          });
        }
      }

      function tick() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles = particles.filter(p => p.life > 0);
        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.08;
          p.life -= 0.02;
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        requestAnimationFrame(tick);
      }
      if (!reduceMotion) requestAnimationFrame(tick);

      // Avatar click
      function foxClick(e) {
        const rect = avatar.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        burst(cx, cy, 24);
        avatar.classList.remove('pop');
        void avatar.offsetWidth;
        avatar.classList.add('pop');
        const msgs = ['🦊 Yip!', '✨ Nice click!', '🚀 Keep building!', '🔥 Fox power!', '💫 Hello!'];
        showToast(msgs[Math.floor(Math.random() * msgs.length)]);
      }
      avatar.addEventListener('click', foxClick);
      avatar.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); foxClick(e); }
      });

      // Anywhere click soft particles
      document.addEventListener('click', (e) => {
        if (e.target.closest('.avatar') || e.target.closest('a')) return;
        burst(e.clientX, e.clientY, 8);
      });

      // Konami code easter egg
      const konami = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
      let kIndex = 0;
      document.addEventListener('keydown', (e) => {
        if (e.key === konami[kIndex]) {
          kIndex++;
          if (kIndex === konami.length) {
            kIndex = 0;
            showToast('🎮 Konami unlocked — you legend!');
            for (let i = 0; i < 6; i++) {
              setTimeout(() => burst(window.innerWidth/2, window.innerHeight/2, 30), i * 120);
            }
          }
        } else {
          kIndex = 0;
        }
      });
    })();
  </script>
</body>
</html>
