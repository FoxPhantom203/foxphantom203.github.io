  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.1/cdn/themes/dark.css">

  <style>
    :root {
      --bg: #0f0f12;
      --surface: rgba(26, 26, 34, 0.85);
      --text: #e8e8ed;
      --muted: #9a9aad;
      --accent: #ff6b35;
      --accent-soft: rgba(255, 107, 53, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      background-image:
        linear-gradient(135deg, rgba(15,15,18,0.88) 0%, rgba(20,10,30,0.75) 50%, rgba(15,15,18,0.9) 100%),
        url("https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1920&q=80");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      line-height: 1.6;
      position: relative;
      overflow-x: hidden;
    }

    /* Decorative floating orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
      animation: float 12s ease-in-out infinite;
    }
    .orb-1 {
      width: 320px; height: 320px;
      background: #ff6b35;
      top: -80px; left: -60px;
      animation-delay: 0s;
    }
    .orb-2 {
      width: 280px; height: 280px;
      background: #7c3aed;
      bottom: -40px; right: -40px;
      animation-delay: -4s;
    }
    .orb-3 {
      width: 180px; height: 180px;
      background: #06b6d4;
      top: 40%; left: 10%;
      animation-delay: -7s;
    }
    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -20px) scale(1.05); }
      66% { transform: translate(-20px, 15px) scale(0.95); }
    }

    /* Sparkle decorations */
    .sparkle {
      position: fixed;
      width: 6px; height: 6px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 8px 2px rgba(255,255,255,0.6);
      pointer-events: none;
      z-index: 0;
      animation: twinkle 3s ease-in-out infinite;
    }
    .sparkle:nth-child(1) { top: 12%; left: 18%; animation-delay: 0.2s; }
    .sparkle:nth-child(2) { top: 25%; right: 22%; animation-delay: 1.1s; }
    .sparkle:nth-child(3) { bottom: 30%; left: 28%; animation-delay: 0.7s; }
    .sparkle:nth-child(4) { bottom: 18%; right: 15%; animation-delay: 1.8s; }
    .sparkle:nth-child(5) { top: 55%; left: 8%; animation-delay: 0.4s; }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 1.25rem;
      padding: 2.5rem 3rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--accent-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      margin: 0 auto 1.25rem;
      border: 2px solid var(--accent);
      box-shadow: 0 0 24px rgba(255, 107, 53, 0.35);
      animation: pulse-glow 3s ease-in-out infinite;
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(255, 107, 53, 0.3); }
      50% { box-shadow: 0 0 36px rgba(255, 107, 53, 0.55); }
    }
    h1 {
      font-family: "Orbitron", sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
      background: linear-gradient(90deg, #ff6b35, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .tagline {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 1.75rem;
    }
    .links {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .links a {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.55rem 1.1rem;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 14px rgba(255, 107, 53, 0.35);
    }
    .links a:hover {
      transform: translateY(-2px);
      opacity: 0.95;
      box-shadow: 0 6px 20px rgba(255, 107, 53, 0.5);
    }
    .links a.secondary {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: var(--text);
      box-shadow: none;
    }
    .links a.secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    footer {
      position: relative;
      z-index: 1;
      margin-top: 2.5rem;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .deco-icons {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      margin-bottom: 1rem;
      font-size: 1.1rem;
      opacity: 0.7;
    }
    .deco-icons span {
      animation: bounce-soft 2.5s ease-in-out infinite;
    }
    .deco-icons span:nth-child(2) { animation-delay: 0.3s; }
    .deco-icons span:nth-child(3) { animation-delay: 0.6s; }
    @keyframes bounce-soft {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
  </style>
</head>
<body>
  <!-- Decorative layers -->

  <div class="sparkle"></div>

    </div>

  <footer>foxphantom203.github.io</footer>

</body>
